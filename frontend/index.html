<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-RAG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  
  :root {
    --bg: #e5e6e9;
    --ink: #18181b;
    --border: #d1d2d6;
    --panel: #f4f4f6;
    --primary: #18181b;
    --primary-text: #ffffff;
    --danger: #dc2626;
    --orb-bg: #e5e6e9;
  }
  
  * { box-sizing: border-box; }
  html, body {
    background: #e5e6e9;
  }
  body {
    margin: 0; padding: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    color: var(--ink);
    background: var(--bg);
  }
  
  .side-panel {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 10;
  }
  .side-panel.open {
    transform: translateX(0);
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.2);
    z-index: 9;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .burger-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 5;
    padding: 8px;
  }
  .burger-btn svg {
    width: 28px;
    height: 28px;
    fill: var(--ink);
  }
  .side-panel h2 {
    margin: 0 0 16px 0;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .doc-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .doc-item {
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    word-break: break-all;
    color: #18181b;
  }
  
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: #e5e6e9;
    gap: 24px;
  }
  
  .drop-box {
    width: 100%;
    padding: 24px 16px;
    margin-bottom: 24px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    transition: all 0.2s;
    gap: 12px;
    text-align: center;
  }
  .drop-box.drag-over {
    border-color: var(--ink);
    background: #e5e6e9;
  }
  .drop-box p {
    margin: 0;
    font-weight: 500;
    color: #52525b;
    font-size: 0.9rem;
  }
  
  .btn {
    background: var(--primary);
    color: var(--primary-text);
    border: none;
    padding: 12px 24px;
    border-radius: 99px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: inherit;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-upload {
    background: #ffffff;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-upload:hover { background: #e5e6e9; }
  
  .start-btn {
    font-size: 1.2rem;
    padding: 16px 48px;
  }
  .start-btn.active {
    background: var(--danger);
    color: #fff;
  }
  
  #fileInput { display: none; }
  
  .status {
    font-size: 0.9rem;
    color: #52525b;
    height: 20px;
  }
  
  .assistant-orb {
    width: 500px;
    height: 500px;
    border-radius: 50%;
    margin-bottom: 20px;
    object-fit: cover;
    transition: transform 0.3s;
  }
</style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  
  <button class="burger-btn" id="burgerBtn">
    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
  </button>

  <div class="side-panel" id="sidePanel">
    <div class="drop-box" id="dropBox">
      <p style="font-size:0.85rem">Drop documents here<br>(.txt, .pdf, .docx, .pptx, images)</p>
      <button class="btn btn-upload" id="uploadBtn">Browse Files</button>
      <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.pptx,.png,.jpg,.jpeg">
    </div>
    
    <h2>Saved Documents</h2>
    <div class="doc-list" id="docList">
      <!-- Docs go here -->
    </div>
  </div>
  
  <div class="main-area">
    <video class="assistant-orb" id="orb" src="/original-c57b681754e7d29bb59792de101d6bd2.mp4" muted playsinline loop></video>
    <button class="btn start-btn" id="startBtn">Start Conversation</button>
    <div class="status" id="statusText">Ready</div>
  </div>

  <script>
    // Elements
    const dropBox = document.getElementById('dropBox');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const docList = document.getElementById('docList');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('statusText');
    const burgerBtn = document.getElementById('burgerBtn');
    const sidePanel = document.getElementById('sidePanel');
    const overlay = document.getElementById('overlay');
    
    // Burger Menu Logic
    const toggleMenu = () => {
      sidePanel.classList.toggle('open');
      overlay.classList.toggle('open');
    };
    burgerBtn.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);
    
    // Upload logic
    const handleFiles = async (files) => {
      for (const file of files) {
        const allowedExts = ['.txt', '.pdf', '.docx', '.pptx', '.png', '.jpg', '.jpeg'];
        const isAllowed = allowedExts.some(ext => file.name.toLowerCase().endsWith(ext));
        if (!isAllowed) {
          alert('Unsupported file type. Supported: txt, pdf, docx, pptx, png, jpg');
          continue;
        }
        
        statusText.textContent = `Uploading ${file.name}... (It may take a while)`;
        const formData = new FormData();
        formData.append('file', file);
        
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.status === 'success') {
            appendDocItem(data);
            statusText.textContent = `Uploaded ${file.name}`;
          }
        } catch (e) {
          statusText.textContent = `Upload failed: ${e.message}`;
        }
      }
    };
    
    // Create doc item with buttons
    const appendDocItem = (doc) => {
      const docEl = document.createElement('div');
      docEl.className = 'doc-item';
      docEl.style.display = 'flex';
      docEl.style.justifyContent = 'space-between';
      docEl.style.alignItems = 'center';
      
      const titleSpan = document.createElement('span');
      titleSpan.textContent = doc.title;
      titleSpan.style.overflow = 'hidden';
      titleSpan.style.textOverflow = 'ellipsis';
      titleSpan.style.whiteSpace = 'nowrap';
      
      const btnGroup = document.createElement('div');
      btnGroup.style.display = 'flex';
      btnGroup.style.gap = '5px';
      
      if (doc.url) {
        const viewBtn = document.createElement('button');
        viewBtn.textContent = 'View';
        viewBtn.style.padding = '2px 8px';
        viewBtn.style.fontSize = '0.75rem';
        viewBtn.style.cursor = 'pointer';
        viewBtn.style.background = '#e5e6e9';
        viewBtn.style.border = '1px solid #d1d2d6';
        viewBtn.style.color = '#18181b';
        viewBtn.style.borderRadius = '4px';
        viewBtn.onclick = () => window.open(doc.url, '_blank');
        btnGroup.appendChild(viewBtn);
      }
      
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Del';
      delBtn.style.padding = '2px 8px';
      delBtn.style.fontSize = '0.75rem';
      delBtn.style.cursor = 'pointer';
      delBtn.style.background = '#fee2e2';
      delBtn.style.border = '1px solid #fca5a5';
      delBtn.style.color = '#991b1b';
      delBtn.style.borderRadius = '4px';
      delBtn.onclick = async () => {
        if (confirm('Delete this document?')) {
          delBtn.textContent = '...';
          const res = await fetch(`/api/documents/${doc.doc_id}`, { method: 'DELETE' });
          if (res.ok) docEl.remove();
        }
      };
      btnGroup.appendChild(delBtn);
      
      docEl.appendChild(titleSpan);
      docEl.appendChild(btnGroup);
      docList.appendChild(docEl);
    };

    // Fetch initial docs
    const fetchDocuments = async () => {
      try {
        const res = await fetch('/api/documents');
        const data = await res.json();
        if (data.status === 'success') {
          docList.innerHTML = '';
          data.documents.forEach(doc => appendDocItem(doc));
        }
      } catch (e) {
        console.error("Failed to load documents:", e);
      }
    };
    
    // Call it when page loads
    window.addEventListener('DOMContentLoaded', fetchDocuments);
    
    // Drag & Drop
    dropBox.addEventListener('dragover', (e) => { e.preventDefault(); dropBox.classList.add('drag-over'); });
    dropBox.addEventListener('dragleave', () => dropBox.classList.remove('drag-over'));
    dropBox.addEventListener('drop', (e) => {
      e.preventDefault();
      dropBox.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    });
    
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    
    // Audio / WebSocket logic
    let ws = null;
    let audioCtx = null;
    let mediaStream = null;
    let scriptNode = null;
    let isConversing = false;
    let nextAudioTime = 0;
    
    // Video Control Logic for Orb
    const orbVideo = document.getElementById('orb');

    const pauseVideoAtPauseFrame = () => {
      orbVideo.pause();
      try {
        orbVideo.currentTime = 7; // Pause at 0:07 timestamp when idle
      } catch (e) {
        orbVideo.currentTime = 0;
      }
    };

    orbVideo.addEventListener('loadedmetadata', pauseVideoAtPauseFrame);
    pauseVideoAtPauseFrame();

    const startConversation = async () => {
      try {
        statusText.textContent = 'Connecting...';
        
        // 1. Get Microphone
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: {
            echoCancellation: true, noiseSuppression: true, autoGainControl: true
        }});
        
        // 2. Setup Audio Context for recording at 16kHz
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioCtx.createMediaStreamSource(mediaStream);
        scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
        source.connect(scriptNode);
        scriptNode.connect(audioCtx.destination); // Required for scriptNode to fire
        
        nextAudioTime = audioCtx.currentTime;
        
        // 3. Connect WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws/live`);
        ws.binaryType = 'arraybuffer';
        
        ws.onopen = () => {
            statusText.textContent = 'Connected. Speak now...';
            isConversing = true;
            startBtn.textContent = 'Stop';
            startBtn.classList.add('active');
            orbVideo.currentTime = 0;
            orbVideo.playbackRate = 0.75; // Slower playback rate during conversation
            orbVideo.play().catch(e => console.error("Play error:", e));
        };
        
        ws.onmessage = (event) => {
            // Play received audio
            if (event.data instanceof ArrayBuffer) {
                playAudioChunk(event.data);
            }
        };
        
        ws.onclose = () => {
            stopConversation();
            statusText.textContent = 'Disconnected';
        };
        
        // 4. Send audio
        scriptNode.onaudioprocess = (e) => {
            if (!isConversing || ws.readyState !== WebSocket.OPEN) return;
            const inputData = e.inputBuffer.getChannelData(0);
            const pcm16 = new Int16Array(inputData.length);
            for (let i = 0; i < inputData.length; i++) {
                pcm16[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
            }
            ws.send(pcm16.buffer);
        };
        
      } catch (e) {
        statusText.textContent = `Error: ${e.message}`;
        stopConversation();
      }
    };
    
    const playAudioChunk = (arrayBuffer) => {
        if (!audioCtx) return;
        const pcm16 = new Int16Array(arrayBuffer);
        const float32 = new Float32Array(pcm16.length);
        for (let i = 0; i < pcm16.length; i++) {
            float32[i] = pcm16[i] / 32768;
        }
        
        // The default Gemini audio output is 24kHz. 
        const buffer = audioCtx.createBuffer(1, float32.length, 24000);
        buffer.getChannelData(0).set(float32);
        
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        
        const playTime = Math.max(audioCtx.currentTime, nextAudioTime);
        source.start(playTime);
        nextAudioTime = playTime + buffer.duration;
    };
    
    const stopConversation = () => {
      isConversing = false;
      if (ws) { ws.close(); ws = null; }
      if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      startBtn.textContent = 'Start Conversation';
      startBtn.classList.remove('active');
      pauseVideoAtPauseFrame();
    };
    
    startBtn.addEventListener('click', () => {
      if (isConversing) {
        stopConversation();
        statusText.textContent = 'Ready';
      } else {
        startConversation();
      }
    });
  </script>
</body>
</html>
